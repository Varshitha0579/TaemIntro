<!DOCTYPE html>
<html lang="en">

        body { font-family: Arial, sans-serif; text-align: center; background: #f4f4f4; }
        h1 { color: #333; }

            border: 1px solid #ccc;

            margin: 20px; 
            background: #fff; 
            display: inline-block; 
            width: 250px;
            box-shadow: 2px 2px 8px rgba(0,0,0,0.1);
        }
        img { 
            width: 150px; 
            height: 150px; 
            border-radius: 50%; 
            object-fit: cover; 
        }
    </style>
</head>
<body>

    <h1>Welcome to Our Team!</h1>

    <div class="member">
        <img src="https://randomuser.me/api/portraits/women/44.jpg" alt="Random Person 1">

    </div>

    <div class="member">
        <img src="https://randomuser.me/api/portraits/men/32.jpg" alt="Random Person 2">
        <h2>Bob Smith</h2>
        <p>Department: Marketing</p>
    </div>

    <div class="member">
        <img src="https://randomuser.me/api/portraits/women/68.jpg" alt="Random Person 3">

    <div class="member">

</html>
